<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VECTOR//CORE - AWAKENING VECTOR</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="title">VECTOR<span>//</span>CORE</div>
      <div id="turnInfo">-</div>
    </header>

    <!-- ===== メニュー画面 ===== -->
    <section id="menuScreen" class="screen">
      <button class="menuBtn" id="btnStory">ストーリーモード</button>
      <button class="menuBtn" id="btnStartBattle">フリー対戦</button>
      <button class="menuBtn" id="btnDeckBuild">デッキ編成</button>
      <button class="menuBtn" id="btnCollection">カード図鑑</button>
      <div id="deckStatus" class="menuNote"></div>
    </section>

    <!-- ===== ストーリーマップ画面 ===== -->
    <section id="storyScreen" class="screen hidden">
      <div class="screenHeader">
        <button class="backBtn" id="storyBackBtn">戻る</button>
        <div>ストーリーMAP</div>
        <div></div>
      </div>
      <div id="storyList" class="storyList"></div>
    </section>

    <!-- ===== デッキ編成画面 ===== -->
    <section id="deckScreen" class="screen hidden">
      <div class="screenHeader">
        <button class="backBtn" id="deckBackBtn">保存して戻る</button>
        <div>デッキ編成 <span id="deckCount">0</span>/30</div>
        <button class="backBtn" id="deckResetBtn">初期化</button>
      </div>
      <div id="deckPool" class="poolGrid"></div>
    </section>

    <!-- ===== カード図鑑画面 ===== -->
    <section id="collectionScreen" class="screen hidden">
      <div class="screenHeader">
        <button class="backBtn" id="collectionBackBtn">戻る</button>
        <div>カード図鑑</div>
        <div></div>
      </div>
      <div id="collectionGrid" class="poolGrid"></div>
    </section>

    <!-- ===== 対戦画面 ===== -->
    <section id="gameScreen" class="screen hidden">
      <section class="playerArea opponent">
        <div class="statRow">
          <div class="stat core" id="oppCoreStat">CORE <span id="oppCore">-</span></div>
          <div class="stat shield" id="oppShieldStat">SHIELD <span id="oppShield">-</span></div>
          <div class="stat energy">ENERGY <span id="oppEnergy">-</span></div>
          <div class="stat chain" id="oppChainStat">CHAIN <span id="oppChain">-</span></div>
        </div>
        <div id="oppProtocols" class="protoRow"></div>
        <div id="oppField" class="field"></div>
      </section>

      <section id="logArea"></section>

      <section class="playerArea self">
        <div id="selfField" class="field"></div>
        <div id="selfProtocols" class="protoRow"></div>
        <div class="statRow">
          <div class="stat core" id="selfCoreStat">CORE <span id="selfCore">-</span></div>
          <div class="stat shield" id="selfShieldStat">SHIELD <span id="selfShield">-</span></div>
          <div class="stat energy">ENERGY <span id="selfEnergy">-</span></div>
          <div class="stat chain" id="selfChainStat">CHAIN <span id="selfChain">-</span></div>
        </div>
        <div id="handArea" class="hand"></div>
        <div id="controls">
          <button class="backBtn" id="quitBtn">やめる</button>
          <button id="endTurnBtn">END TURN</button>
        </div>
      </section>
    </section>

    <div id="banner" class="hidden"></div>

    <!-- ===== ダイアログ(ストーリー会話) ===== -->
    <div id="dialogueOverlay" class="hidden">
      <div id="dialogueBox">
        <div id="dialogueSpeaker"></div>
        <div id="dialogueText"></div>
        <button id="dialogueNextBtn">次へ ▶</button>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlayBox">
        <div id="overlayText"></div>
        <div id="overlayChoices"></div>
        <button id="overlayCloseBtn">閉じる</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
